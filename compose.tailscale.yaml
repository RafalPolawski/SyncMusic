# SyncMusic with a Tailscale sidecar: the server gets its own machine in your
# tailnet and a valid HTTPS certificate at https://syncmusic.<tailnet>.ts.net
# (enable MagicDNS and HTTPS certificates in the Tailscale admin console).
#
#   TS_AUTHKEY=tskey-auth-... docker compose -f compose.tailscale.yaml up -d
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-syncmusic}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?create an auth key in the Tailscale admin console}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale/serve.json:/config/serve.json:ro

  syncmusic:
    image: ghcr.io/rafalpolawski/syncmusic:${SYNCMUSIC_VERSION:-latest}
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      SYNCMUSIC_PASSWORD: ${SYNCMUSIC_PASSWORD:?set SYNCMUSIC_PASSWORD in .env}
      SYNCMUSIC_TRUST_PROXY: "true"
      SYNCMUSIC_COOKIE_SECURE: "true"
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music:ro
      - syncmusic-data:/data

volumes:
  tailscale-state:
  syncmusic-data:
