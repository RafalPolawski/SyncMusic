version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint pins the TypeScript versions it supports
      # (currently < 6.1). Move to a new major together with it, by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web-runtime:
        dependency-type: production
      web-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
